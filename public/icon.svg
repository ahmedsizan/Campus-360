<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Inner Glow -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
  
  <!-- Graduation Cap Icon -->
  <g transform="translate(106, 96)" filter="url(#shadow)" fill="#ffffff">
    <!-- Cap Top Diamond -->
    <path d="M150 20 L290 85 L150 150 L10 85 Z"/>
    <!-- Cap Base / Underneath -->
    <path d="M60 125 L60 195 C60 255, 240 255, 240 195 L240 125 L150 165 Z" opacity="0.95"/>
    <!-- Tassel String and Ball -->
    <path d="M260 98 L285 140 L285 220" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="285" cy="225" r="10" fill="#fbbf24"/>
  </g>
  
  <!-- Text Label -->
  <text x="256" y="420" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="900" font-size="62" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    CAMPUS <tspan fill="#a7f3d0">360</tspan>
  </text>
  <text x="256" y="455" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="22" fill="#d1fae5" text-anchor="middle" letter-spacing="2">
    GREEN UNIVERSITY
  </text>
</svg>
